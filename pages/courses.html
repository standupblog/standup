<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Free Courses – SafeYouth</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="navbar">...</div> <!-- copy navbar from index, adjust active link -->
<div class="mobile-sidebar">...</div>
<div class="overlay"></div>

<div class="container" style="padding-top: 100px;">
    <h1 class="section-title">📘 Free Self-Paced Courses</h1>
    <div id="courseList" class="courses-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 2rem;"></div>
    <div id="courseDetail" style="display: none;">
        <button id="backBtn" class="btn-outline"><i class="fas fa-arrow-left"></i> Back to courses</button>
        <h2 id="courseTitle"></h2>
        <div id="modulesList"></div>
        <button id="claimCertBtn" class="btn-primary" style="margin-top: 2rem;">🎓 Claim Certificate</button>
        <div id="certificateResult"></div>
    </div>
</div>

<script>
    const API_BASE = 'https://your-worker.workers.dev'; // change
    let userId = localStorage.getItem('user_id') || 'user_' + Math.random().toString(36).substring(2);
    localStorage.setItem('user_id', userId);
    let currentCourse = null;

    async function loadCourses() {
        const res = await fetch(`${API_BASE}/api/courses`);
        const courses = await res.json();
        const container = document.getElementById('courseList');
        container.innerHTML = courses.map(c => `
            <div class="course-card" style="background: #FFF4E8; border-radius: 28px; padding: 1.5rem;">
                <h3>${c.title}</h3>
                <button onclick="openCourse('${c.id}')" class="course-btn">Start Learning</button>
            </div>
        `).join('');
    }

    window.openCourse = async (courseId) => {
        const res = await fetch(`${API_BASE}/api/course/${courseId}`);
        const course = await res.json();
        currentCourse = course;
        document.getElementById('courseList').style.display = 'none';
        document.getElementById('courseDetail').style.display = 'block';
        document.getElementById('courseTitle').innerText = course.title;
        const progressRes = await fetch(`${API_BASE}/api/progress?userId=${userId}&courseId=${courseId}`);
        const completed = await progressRes.json();
        let modulesHtml = '<div class="modules">';
        for (let i = 0; i < course.modules.length; i++) {
            const mod = course.modules[i];
            const isDone = completed.includes(mod.id);
            modulesHtml += `
                <div class="module-card" style="background: #FFF; border-radius: 24px; margin: 1rem 0; padding: 1rem;">
                    <h3>${mod.title} ${isDone ? '✅' : ''}</h3>
                    <p>${mod.content}</p>
                    ${mod.video ? `<video controls src="${mod.video}" style="width:100%; border-radius: 20px;"></video>` : ''}
                    ${!isDone ? `<button onclick="markComplete('${courseId}','${mod.id}')" class="course-btn">Mark Complete</button>` : ''}
                </div>
            `;
        }
        modulesHtml += '</div>';
        document.getElementById('modulesList').innerHTML = modulesHtml;
    };

    window.markComplete = async (courseId, moduleId) => {
        await fetch(`${API_BASE}/api/register-complete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, courseId, moduleId })
        });
        alert('Module completed!');
        openCourse(courseId);
    };

    document.getElementById('claimCertBtn').addEventListener('click', async () => {
        const res = await fetch(`${API_BASE}/api/claim-certificate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, courseId: currentCourse.id })
        });
        const data = await res.json();
        if (data.certificate) {
            const win = window.open();
            win.document.write(data.certificate);
        } else {
            alert('Complete all modules first!');
        }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        document.getElementById('courseDetail').style.display = 'none';
        document.getElementById('courseList').style.display = 'grid';
        loadCourses();
    });

    loadCourses();
</script>
<footer>...</footer>
<script src="../js/main.js"></script>
</body>
</html>
